# Security fixes only. Routine version bumps are off (open-pull-requests-limit: 0) because
# major upgrades (Prisma, Next.js) need hands-on migration; Dependabot's security updates
# ignore that limit and arrive grouped into one pull request per ecosystem.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
  # Workflows pin each action to a commit SHA (a moved tag can't swap in other code);
  # Dependabot updates the SHA and its "# vX.Y.Z" comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
