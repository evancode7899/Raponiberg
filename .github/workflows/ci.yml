# Proves a fresh clone sets up, passes its tests and builds, the way a newcomer would run
# it: no .env, no data, no backups. Windows, because the desktop launcher is Windows-only.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # API keys, tokens and private keys anywhere in the history. (Personal data is
  # npm run privacy:check's job: it needs the owner's data to know what's personal, so it
  # runs on their computer before every push instead.)
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read  # gitleaks lists a pull request's commits
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  # The LICENSE must still be the author's. The first step compares a pinned hash in plain
  # shell, so it holds even if scripts/license-guard.ts is gutted; the second runs the full
  # guard (pins, copies, the owner's signature, the name and no-commercial-use tripwires).
  license:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LICENSE_PIN: "license-sha256: 3e664d3a9dea1feb8bf3677de3d9db9837f5b708831bda409093b2429d9116ae"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: LICENSE is the author's
        run: |
          actual="license-sha256: $(sha256sum LICENSE | cut -d' ' -f1)"
          if [ "$actual" != "$LICENSE_PIN" ]; then
            echo "::error::LICENSE is not the author's ($actual, pinned: $LICENSE_PIN)"; exit 1
          fi
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
      - name: License guard
        run: npm run license:check
      - name: Owner key only changes by a rotation the old key signed
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          npm run license:check -- --quiet --since FETCH_HEAD

  fresh-clone:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Set up (empty database, no shortcut)
        run: npm run setup -- --no-shortcuts
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npx tsc --noEmit
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Demo data builds and every figure ties to its proof
        run: npm run demo -- --sweep

  # Every page draws what its proof cleared (SSOT F6, scripts/render-audit.ts), in shards run
  # side by side with fresh-clone: each builds the app and the demo, renders its share of the
  # pages' tabs (dealt from scripts/render-audit-costs.json) against its own budget, and hands
  # what it drew to render-audit, which holds the whole run (a pending page gone clean, a
  # cleared figure no page draws) exactly as one unsharded run would.
  render-audit-shard:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      RENDER_AUDIT_SHARD: ${{ matrix.shard }}/3
      RENDER_AUDIT_OUT: render-audit-${{ matrix.shard }}.json
      RENDER_AUDIT_BUDGET_MS: "100000"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Set up (empty database, no shortcut)
        run: npm run setup -- --no-shortcuts
      - name: Build
        run: npm run build
      - name: Render shard ${{ matrix.shard }} of 3 and hold what it draws to the proof sweep
        run: npm run demo -- --render-audit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: render-audit-${{ matrix.shard }}
          path: render-audit-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 3

  render-audit:
    needs: render-audit-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: render-audit-*
          merge-multiple: true
      - name: The whole run, merged from its shards
        env:
          RENDER_AUDIT_COSTS: render-audit-costs.json
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --disable-warning=ExperimentalWarning scripts/render-audit.ts --merge render-audit-1.json render-audit-2.json render-audit-3.json
      # This run's unit costs: copy over scripts/render-audit-costs.json when the shards drift apart.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: render-audit-costs
          path: render-audit-costs.json
          if-no-files-found: ignore
          retention-days: 7
