# Every merge to main is a release. When CI passes on a push to main, this tags that
# exact commit with the next patch version (v0.2.0 -> v0.2.1) and publishes a GitHub
# release whose notes list the merged pull requests. Copies on the release channel
# (UPDATE_CHANNEL=release, the default) move to it on their next start.
#
# - Only a commit that passed CI is released, and only while it's still the tip of
#   main: if more merges landed meanwhile, the newer CI run releases those instead.
# - A commit that already has a vX.Y.Z tag is skipped, so a release made by hand for a
#   bigger version jump (gh release create v0.3.0 --target <sha>) isn't doubled.
# - package.json's version isn't bumped: the tag is the version, and a package.json
#   change would make every launcher reinstall dependencies on update.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Tag and publish the next version
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          if git tag --points-at "$SHA" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Already released: $(git tag --points-at "$SHA" | tr '\n' ' ')"; exit 0
          fi
          if [ "$(git rev-parse origin/main)" != "$SHA" ]; then
            echo "main has moved past $SHA; the newer CI run releases it."; exit 0
          fi
          last=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -z "$last" ]; then next=v0.1.0; else
            IFS=. read -r major minor patch <<< "${last#v}"
            next="v${major}.${minor}.$((patch + 1))"
          fi
          echo "Releasing $SHA as $next (previous: ${last:-none})"
          gh release create "$next" --target "$SHA" --title "Raponiberg $next" --generate-notes
